[project]
name = "websculpt-docs"
version = "0.0.0"
description = "Documentation toolchain for WebSculpt. Not a distributable package."
requires-python = ">=3.11"

# Docs are built with `uv run --no-project --with ...` (see package.json), so
# this project never gets installed and needs no build backend. The dependency
# list exists so `uv sync` / `uv lock` resolve a reproducible toolchain.
[dependency-groups]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
]
